# Padrões do ambiente local (infra/compose.yaml). Nunca usar em produção.
spring:
  datasource:
    url: ${AURORA_DB_URL:jdbc:postgresql://localhost:5433/aurora}
    password: ${AURORA_APP_PASSWORD:app-dev}
  flyway:
    password: ${AURORA_OWNER_PASSWORD:owner-dev}

aurora:
  seguranca:
    chave-cursor: ${AURORA_CHAVE_CURSOR:chave-de-cursor-de-desenvolvimento-nao-usar}
    # Desligado no ambiente local para os usuários de demonstração e os E2E entrarem só com senha.
    segundo-fator-administradores: ${AURORA_SEGUNDO_FATOR_ADMINISTRADORES:false}
  auditoria:
    chave: ${AURORA_AUDITORIA_CHAVE:chave-de-desenvolvimento-nao-usar-em-producao}
  cors:
    origens: ${AURORA_CORS_ORIGENS:http://localhost:4200}
  identidade:
    segredo: ${AURORA_IDENTIDADE_SEGREDO:api-admin-dev}
    url-retorno: ${AURORA_URL_FRONT:http://localhost:4200/}
  email:
    # Mailpit do infra/compose.yaml (caixa em http://localhost:8025).
    host: ${AURORA_SMTP_HOST:localhost}
    porta: ${AURORA_SMTP_PORTA:1025}
    tls: ${AURORA_SMTP_TLS:false}
