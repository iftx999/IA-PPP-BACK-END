# Padrões do ambiente local (infra/compose.yaml). Nunca usar em produção.
spring:
  datasource:
    url: ${AURORA_DB_URL:jdbc:postgresql://localhost:5433/aurora}
    password: ${AURORA_APP_PASSWORD:app-dev}
  flyway:
    password: ${AURORA_OWNER_PASSWORD:owner-dev}

aurora:
  seguranca:
    chave-cursor: ${AURORA_CHAVE_CURSOR:chave-de-cursor-de-desenvolvimento-nao-usar}
    # Desligado no ambiente local para os usuários de demonstração e os E2E entrarem só com senha.
    segundo-fator-administradores: ${AURORA_SEGUNDO_FATOR_ADMINISTRADORES:false}
    # O IdP corporativo de exemplo roda no Keycloak local (http://localhost:8180/realms/corporativo-exemplo).
    sso-permitir-enderecos-internos: ${AURORA_SSO_PERMITIR_ENDERECOS_INTERNOS:true}
  plataforma:
    emissor: ${AURORA_PLATAFORMA_EMISSOR:http://localhost:8180/realms/plataforma}
    # Desligado no ambiente local para o usuário de demonstração entrar só com senha.
    segundo-fator: ${AURORA_PLATAFORMA_SEGUNDO_FATOR:false}
    url-identidade: ${AURORA_URL_IDENTIDADE:http://localhost:8180}
    segredo: ${AURORA_PLATAFORMA_SEGREDO:plataforma-dev}
    # Quem envia os convites do cliente novo é o Keycloak, dentro do Docker: lá o Mailpit é "mailpit".
    smtp-host: mailpit
    smtp-porta: 1025
  auditoria:
    chave: ${AURORA_AUDITORIA_CHAVE:chave-de-desenvolvimento-nao-usar-em-producao}
  # ADR 0028: no ambiente local os logins aparecem na Auditoria em segundos (produção: a cada 5 minutos).
  trilha-de-acesso:
    atraso-inicial: PT10S
    intervalo: PT20S
  cors:
    origens: ${AURORA_CORS_ORIGENS:http://localhost:4200}
  identidade:
    segredo: ${AURORA_IDENTIDADE_SEGREDO:api-admin-dev}
    url-retorno: ${AURORA_URL_FRONT:http://localhost:4200/}
  email:
    # Mailpit do infra/compose.yaml (caixa em http://localhost:8025).
    host: ${AURORA_SMTP_HOST:localhost}
    porta: ${AURORA_SMTP_PORTA:1025}
    tls: ${AURORA_SMTP_TLS:false}
