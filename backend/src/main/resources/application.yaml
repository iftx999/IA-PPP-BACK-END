spring:
  application:
    name: aurora-api
  threads:
    virtual:
      enabled: true
  datasource:
    # A API conecta como aurora_app (sem BYPASSRLS); o RLS do banco é a última barreira de isolamento.
    url: ${AURORA_DB_URL:jdbc:postgresql://localhost:5433/aurora}
    username: aurora_app
    password: ${AURORA_APP_PASSWORD:app-dev}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Migrações rodam como dono do schema.
    user: aurora_owner
    password: ${AURORA_OWNER_PASSWORD:owner-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

aurora:
  seguranca:
    # Audiência exigida nos tokens de acesso (mapeada no client scope "aurora-api" do Keycloak).
    audiencia: aurora-api
  cors:
    origens: ${AURORA_CORS_ORIGENS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
