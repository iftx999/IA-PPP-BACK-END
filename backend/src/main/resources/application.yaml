# Configuração comum a todos os ambientes. Segredos e endereços vêm de variáveis de ambiente;
# valores padrão de desenvolvimento ficam só em application-dev.yaml.
spring:
  application:
    name: aurora-api
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    # A API conecta como aurora_app (sem BYPASSRLS); o RLS do banco é a última barreira de isolamento.
    url: ${AURORA_DB_URL}
    username: aurora_app
    password: ${AURORA_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    # Migrações rodam como dono do schema.
    user: aurora_owner
    password: ${AURORA_OWNER_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

server:
  shutdown: graceful
  compression:
    enabled: true

aurora:
  seguranca:
    # Audiência exigida nos tokens de acesso (mapeada no client do Keycloak).
    audiencia: aurora-api
    # Segredo dos cursores de paginação (>= 32 caracteres).
    chave-cursor: ${AURORA_CHAVE_CURSOR}
  cors:
    origens: ${AURORA_CORS_ORIGENS}
  contratos:
    # Maior PDF aceito (A1).
    tamanho-maximo-bytes: 52428800
  ia:
    # Extração de contratos (ADR 0014) e assistente (ADR 0018). Provedor claude (padrão) ou openai (ADR 0019).
    # Sem chave, a extração vira cadastro manual e o assistente fica desligado.
    provedor: ${AURORA_IA_PROVEDOR:claude}
    chave: ${AURORA_IA_CHAVE:}
    modelo: claude-opus-5-5
    openai:
      chave: ${AURORA_IA_OPENAI_CHAVE:}
      # Sem padrão: defina o modelo contratado (ex.: AURORA_IA_OPENAI_MODELO).
      modelo: ${AURORA_IA_OPENAI_MODELO:}
      esforco: ${AURORA_IA_OPENAI_ESFORCO:}
      # US$ por milhão de tokens; sem preço, o uso é contado sem custo.
      preco-entrada: ${AURORA_IA_OPENAI_PRECO_ENTRADA:}
      preco-saida: ${AURORA_IA_OPENAI_PRECO_SAIDA:}
      preco-cache-lido: ${AURORA_IA_OPENAI_PRECO_CACHE_LIDO:}
    url-base: ${AURORA_IA_URL:}
  identidade:
    # Client com conta de serviço (manage-users, view-users) em cada realm de tenant (ADR 0011).
    cliente-id: aurora-api-admin
    segredo: ${AURORA_IDENTIDADE_SEGREDO}
    cliente-web: aurora-web
    url-retorno: ${AURORA_URL_FRONT}
    # Prazo dos links de convite e de redefinição de senha (uso único).
    validade-convite: 72h
  auditoria:
    # Chave do HMAC da trilha (>= 32 bytes). Guardar em cofre de segredos; trocar exige nova cadeia (ADR 0009).
    chave: ${AURORA_AUDITORIA_CHAVE}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
