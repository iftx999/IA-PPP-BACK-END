# Testes: sem tarefas agendadas (alertas, trilha de acesso, expurgo). A propriedade precisa estar aqui, e não só no
# DynamicPropertyRegistrar do TestcontainersConfiguration, porque @ConditionalOnProperty é avaliado antes dele.
aurora:
  tarefas:
    habilitadas: false
  # Os testes reaproveitam o mesmo contexto e os mesmos usuários; o limite é testado à parte.
  seguranca:
    limite-por-minuto: 100000
