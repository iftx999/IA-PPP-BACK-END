name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # OCR de contratos digitalizados (ADR 0021): os testes de OCR rodam com o Tesseract de verdade.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
      # Inclui os testes de isolamento entre tenants (obrigatórios, RN-15) via Testcontainers.
      - run: ./mvnw -B verify
      # Testes de mutação nas regras de adesão, situação, projeção e alertas (ADR 0031): falha abaixo de 95%.
      - run: ./mvnw -B -Pmutacao org.pitest:pitest-maven:mutationCoverage -Djacoco.skip=true
      # Análise estática com regras de segurança (SpotBugs + FindSecBugs, ADR 0032): achado médio ou alto bloqueia.
      - run: ./mvnw -B -Panalise spotbugs:check -Djacoco.skip=true

  dependencias:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      # Vulnerabilidades conhecidas nas dependências do pom (ADR 0032): crítica com correção bloqueia; altas vão para
      # a aba Security pelo SARIF.
      - name: Varredura das dependências (Trivy)
        run: >
          docker run --rm -v "$PWD/backend:/repo:ro" -v "$PWD:/saida" aquasec/trivy:0.67.2 fs --quiet
          --scanners vuln --severity HIGH,CRITICAL --format sarif --output /saida/trivy-dependencias.sarif
          --db-repository mirror.gcr.io/aquasec/trivy-db,public.ecr.aws/aquasecurity/trivy-db /repo
          && docker run --rm -v "$PWD/backend:/repo:ro" aquasec/trivy:0.67.2 fs --quiet --scanners vuln
          --severity CRITICAL --ignore-unfixed --exit-code 1
          --db-repository mirror.gcr.io/aquasec/trivy-db,public.ecr.aws/aquasecurity/trivy-db /repo
      - if: always() && hashFiles('trivy-dependencias.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-dependencias.sarif
          category: trivy-dependencias

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Imagem só é publicada com o CI inteiro verde (ADR 0022).
  imagens:
    needs: [backend, dependencias, segredos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/imagens.yml
