# Aurora em produção num host único (doc 09, 9.6; ADR 0022): proxy com TLS automático, front, API, PostgreSQL,
# Keycloak e, com o perfil "observabilidade", Prometheus, Tempo e Grafana.
#   cp .env.example .env   # preencher (nunca versionar o .env)
#   docker compose --env-file .env up -d
#   docker compose --env-file .env --profile observabilidade up -d
# Nome próprio: os volumes ficam "aurora-producao_*" e nunca colidem com volumes antigos ou de desenvolvimento.
name: aurora-producao

x-reinicio: &reinicio
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# Backup contínuo com pgBackRest (ADR 0039): mesma configuração no postgres (que arquiva o WAL) e no backup-pitr
# (que faz os backups de base). Repositório 1 no volume local, cifrado; o 2 (S3, fora do host) vem do pitr.env.
x-pgbackrest: &pgbackrest
  PGBACKREST_STANZA: aurora
  PGBACKREST_PG1_PATH: /var/lib/postgresql/18/docker
  PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
  PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${AURORA_BACKUP_CHAVE:?defina AURORA_BACKUP_CHAVE no .env}
  PGBACKREST_REPO1_RETENTION_FULL: ${AURORA_PITR_SEMANAS:-2}
  PGBACKREST_COMPRESS_TYPE: zst
  PGBACKREST_PROCESS_MAX: "2"
  PGBACKREST_LOG_LEVEL_CONSOLE: info
  PGBACKREST_LOG_LEVEL_FILE: "off"
  PGBACKREST_START_FAST: "y"

services:
  proxy:
    <<: *reinicio
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AURORA_DOMINIO: ${AURORA_DOMINIO}
      AURORA_DOMINIO_ID: ${AURORA_DOMINIO_ID}
      AURORA_EMAIL_TLS: ${AURORA_EMAIL_TLS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on: [web, keycloak]

  web:
    <<: *reinicio
    image: ${AURORA_REGISTRO}/aurora-web:${AURORA_VERSAO}
    environment:
      AURORA_API_ENDERECO: api:8080
      AURORA_EMISSOR: https://${AURORA_DOMINIO_ID}/realms/aurora
      AURORA_CLIENTE_ID: aurora-web
      # Vários clientes nesta instalação (ADR 0027): tela do código da empresa e área /plataforma.
      AURORA_ESCOLHER_CLIENTE: ${AURORA_VARIOS_CLIENTES:-false}
      AURORA_EMISSOR_PLATAFORMA: https://${AURORA_DOMINIO_ID}/realms/plataforma
      AURORA_CSP_CONEXOES: https://${AURORA_DOMINIO_ID} ${AURORA_CSP_MAPA}
      AURORA_CSP_IMAGENS: ${AURORA_CSP_MAPA}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *reinicio
    image: ${AURORA_REGISTRO}/aurora-api:${AURORA_VERSAO}
    environment:
      AURORA_DB_URL: jdbc:postgresql://postgres:5432/aurora
      AURORA_APP_PASSWORD: ${AURORA_APP_PASSWORD}
      AURORA_OWNER_PASSWORD: ${AURORA_OWNER_PASSWORD}
      AURORA_CHAVE_CURSOR: ${AURORA_CHAVE_CURSOR}
      AURORA_AUDITORIA_CHAVE: ${AURORA_AUDITORIA_CHAVE}
      AURORA_IDENTIDADE_SEGREDO: ${AURORA_IDENTIDADE_SEGREDO}
      AURORA_URL_FRONT: https://${AURORA_DOMINIO}
      AURORA_CORS_ORIGENS: https://${AURORA_DOMINIO}
      # Chaves dos tokens e Admin API pela rede interna (o emissor validado continua o público).
      AURORA_IDENTIDADE_URL_INTERNA: http://keycloak:8080
      # Administração da plataforma (ADR 0027).
      AURORA_PLATAFORMA_EMISSOR: https://${AURORA_DOMINIO_ID}/realms/plataforma
      AURORA_URL_IDENTIDADE: https://${AURORA_DOMINIO_ID}
      AURORA_PLATAFORMA_SEGREDO: ${AURORA_PLATAFORMA_SEGREDO:-}
      AURORA_IA_PROVEDOR: ${AURORA_IA_PROVEDOR:-claude}
      AURORA_IA_CHAVE: ${AURORA_IA_CHAVE:-}
      AURORA_IA_OPENAI_CHAVE: ${AURORA_IA_OPENAI_CHAVE:-}
      AURORA_IA_OPENAI_MODELO: ${AURORA_IA_OPENAI_MODELO:-}
      # Alertas por e-mail (ADR 0024); mesmo SMTP do Keycloak. Host vazio desliga.
      AURORA_SMTP_HOST: ${AURORA_SMTP_HOST:-}
      AURORA_SMTP_PORTA: ${AURORA_SMTP_PORTA:-587}
      AURORA_SMTP_REMETENTE: ${AURORA_SMTP_REMETENTE:-}
      AURORA_SMTP_USUARIO: ${AURORA_SMTP_USUARIO:-}
      AURORA_SMTP_SENHA: ${AURORA_SMTP_SENHA:-}
      AURORA_AMBIENTE: ${AURORA_AMBIENTE:-producao}
      AURORA_TRACING_LIGADO: ${AURORA_TRACING_LIGADO:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      # Antivírus obrigatório nos arquivos enviados (ADR 0033).
      AURORA_ANTIVIRUS_HOST: clamav
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      clamav: { condition: service_started }

  # Antivírus (ADR 0033): só na rede interna. Precisa de ~1,5 GB de memória para as assinaturas, que o freshclam
  # atualiza sozinho; na primeira subida, envios ficam recusados (503) até o clamd terminar de carregar.
  clamav:
    <<: *reinicio
    image: clamav/clamav:1.4
    volumes:
      - clamav-assinaturas:/var/lib/clamav

  postgres:
    <<: *reinicio
    image: ${AURORA_REGISTRO}/aurora-postgres:${AURORA_VERSAO}
    # WAL arquivado a cada segmento ou, com pouca escrita, a cada 60 s: perda máxima de ~1 min (ADR 0039).
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=aurora archive-push %p
      - -c
      - archive_timeout=60
    environment:
      <<: *pgbackrest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AURORA_OWNER_PASSWORD: ${AURORA_OWNER_PASSWORD}
      AURORA_APP_PASSWORD: ${AURORA_APP_PASSWORD}
    env_file:
      - path: pitr/pitr.env
        required: false
    volumes:
      - postgres-dados:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
      - pitr-repositorio:/var/lib/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurora"]
      interval: 5s
      retries: 20
    shm_size: 256m

  keycloak-db:
    <<: *reinicio
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    <<: *reinicio
    image: quay.io/keycloak/keycloak:26.8.1
    # Modo produção atrás do proxy (TLS termina no Caddy). O realm é importado só se ainda não existir.
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AURORA_DOMINIO_ID}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USUARIO}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_SENHA}
      # Placeholders do realm de produção (gerar-realm-producao.py).
      AURORA_URL_FRONT: https://${AURORA_DOMINIO}
      AURORA_IDENTIDADE_SEGREDO: ${AURORA_IDENTIDADE_SEGREDO}
      AURORA_SMTP_HOST: ${AURORA_SMTP_HOST}
      AURORA_SMTP_PORTA: ${AURORA_SMTP_PORTA}
      AURORA_SMTP_REMETENTE: ${AURORA_SMTP_REMETENTE}
      AURORA_SMTP_USUARIO: ${AURORA_SMTP_USUARIO}
      AURORA_SMTP_SENHA: ${AURORA_SMTP_SENHA}
    volumes:
      - ../keycloak/realm-aurora-producao.json:/opt/keycloak/data/import/realm-aurora.json:ro
      - ../keycloak/realm-plataforma-producao.json:/opt/keycloak/data/import/realm-plataforma.json:ro
      - ../keycloak/temas/aurora:/opt/keycloak/themes/aurora:ro
    depends_on:
      keycloak-db: { condition: service_healthy }

  # Backups de base do pgBackRest (ADR 0039): completo semanal, diferencial diário, verificação semanal. Lê os
  # arquivos de dados pelo mesmo volume e fala com o PostgreSQL pelo socket local (sem senha na rede).
  backup-pitr:
    <<: *reinicio
    image: ${AURORA_REGISTRO}/aurora-postgres:${AURORA_VERSAO}
    user: postgres
    entrypoint: ["/bin/sh", "/pitr/agendar.sh"]
    environment:
      <<: *pgbackrest
      TZ: America/Sao_Paulo
    env_file:
      - path: pitr/pitr.env
        required: false
    volumes:
      - postgres-dados:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
      - pitr-repositorio:/var/lib/pgbackrest
      - ./pitr/agendar.sh:/pitr/agendar.sh:ro
    depends_on:
      postgres: { condition: service_healthy }

  # Cópia lógica diária (pg_dump) dos dois bancos: segunda linha de defesa e restauração seletiva. O banco do
  # Keycloak só tem esta.
  backup:
    <<: *reinicio
    image: postgres:18.6-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      TZ: America/Sao_Paulo
      PGPASSWORD_AURORA: ${POSTGRES_PASSWORD}
      PGPASSWORD_KEYCLOAK: ${KEYCLOAK_DB_PASSWORD}
      AURORA_BACKUP_DIAS: ${AURORA_BACKUP_DIAS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
      keycloak-db: { condition: service_healthy }

  # ---- Observabilidade (docker compose --profile observabilidade ...) ----
  prometheus:
    <<: *reinicio
    profiles: [observabilidade]
    image: prom/prometheus:v3.13.4
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-dados:/prometheus

  tempo:
    <<: *reinicio
    profiles: [observabilidade]
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observabilidade/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-dados:/var/tempo

  grafana:
    <<: *reinicio
    profiles: [observabilidade]
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USUARIO}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_SENHA}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${AURORA_DOMINIO}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/paineis:/var/lib/grafana/paineis:ro
      - grafana-dados:/var/lib/grafana

volumes:
  clamav-assinaturas:
  caddy-dados:
  caddy-config:
  postgres-dados:
  postgres-socket:
  pitr-repositorio:
  keycloak-dados:
  prometheus-dados:
  tempo-dados:
  grafana-dados:
