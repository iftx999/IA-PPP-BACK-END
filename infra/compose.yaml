# Ambiente de desenvolvimento da Aurora.
#   docker compose -f infra/compose.yaml up -d
name: aurora-dev

services:
  postgres:
    build: ./postgres
    image: aurora-postgres:dev
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AURORA_OWNER_PASSWORD: ${AURORA_OWNER_PASSWORD}
      AURORA_APP_PASSWORD: ${AURORA_APP_PASSWORD}
    ports:
      - "5433:5432"   # 5433 para não colidir com outros Postgres locais
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurora"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-aurora.json:/opt/keycloak/data/import/realm-aurora.json:ro
      # Diretório corporativo fictício para testar o SSO (S10, ADR 0025); só no desenvolvimento.
      - ./keycloak/realm-corporativo-exemplo.json:/opt/keycloak/data/import/realm-corporativo-exemplo.json:ro
      # Administração da plataforma (S1, ADR 0027).
      - ./keycloak/realm-plataforma.json:/opt/keycloak/data/import/realm-plataforma.json:ro
      - ./keycloak/temas/aurora:/opt/keycloak/themes/aurora:ro

  # Conta de serviço do master que a API usa para criar o realm de cada cliente novo (ADR 0027). Roda e termina.
  keycloak-configuracao:
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["/bin/bash", "/configurar-plataforma.sh"]
    environment:
      KC_SERVIDOR: http://keycloak:8180
      KC_USUARIO: admin
      KC_SENHA: ${KEYCLOAK_ADMIN_PASSWORD}
      AURORA_PLATAFORMA_SEGREDO: plataforma-dev
    volumes:
      - ./keycloak/configurar-plataforma.sh:/configurar-plataforma.sh:ro
    depends_on: [keycloak]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP

volumes:
  postgres-dados:
