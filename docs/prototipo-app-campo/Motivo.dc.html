<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Paralisar com motivo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0a6b5b}a:hover{color:#074d41}
textarea:focus-visible,button:focus-visible{outline:3px solid #2c9aeb;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(11,26,31,.55); font-family: Inter, system-ui, sans-serif; color: #0b1a1f; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-labelledby="h-par" style="background: #ffffff; border-radius: 24px 24px 0 0; padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #c7d4d1"></span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 id="h-par" style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px">Paralisar OS 1042</h1>
      <span style="font-size: 14px; color: #3d5359">O tempo parado fica separado do tempo de execução.</span>
    </div>
    <div role="radiogroup" aria-label="Motivo" style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{motivos}}" as="m" hint-placeholder-count="6">
        <button type="button" role="radio" aria-checked="{{m.marcado}}" onClick="{{m.escolher}}" style="min-height: 54px; text-align: left; padding: 0 14px; border-radius: 12px; border: {{m.borda}}; background: {{m.fundo}}; font: 600 16px Inter, sans-serif; color: #0b1a1f; display: flex; align-items: center; gap: 12px; cursor: pointer">
          <span style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #0a6b5b; background: {{m.ponto}}; box-shadow: inset 0 0 0 3px #ffffff; flex: none"></span>
          {{m.nome}}
        </button>
      </sc-for>
    </div>
    <sc-if value="{{exigeObservacao}}" hint-placeholder-val="{{ false }}">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Observação (obrigatória para “Outro”)
        <textarea rows="2" maxlength="500" placeholder="Descreva o motivo" style="border: 1px solid #b9cbc7; border-radius: 12px; padding: 10px 12px; font: 16px Inter, sans-serif; resize: none"></textarea>
      </label>
    </sc-if>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px">
      <a href="Ordem.dc.html" style="min-height: 56px; border-radius: 14px; border: 2px solid #3d5359; color: #3d5359; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Cancelar</a>
      <a href="Main.dc.html" style="min-height: 56px; border-radius: 14px; background: #6a5813; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Paralisar</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { motivo: 'Chuva' };
  }
  renderVals() {
    const nomes = ['Chuva', 'Falta de material', 'Aguardando outra equipe', 'Trânsito interditado', 'Intervalo', 'Outro'];
    return {
      exigeObservacao: this.state.motivo === 'Outro',
      motivos: nomes.map((nome) => {
        const marcado = this.state.motivo === nome;
        return { nome, marcado: marcado ? 'true' : 'false',
          borda: marcado ? '2px solid #0a6b5b' : '1px solid #d3e0dd',
          fundo: marcado ? '#e6f1ee' : '#ffffff', ponto: marcado ? '#0a6b5b' : '#ffffff',
          escolher: () => this.setState({ motivo: nome }) };
      })
    };
  }
}
</script>
</body>
</html>
